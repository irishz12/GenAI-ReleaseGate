name: CI

on:
  push:
    branches: [main]
  pull_request:

# This workflow is entirely offline: every test in tests/unit/ runs against
# in-memory SQLite and Fake*Client stand-ins (see docs/ARCHITECTURE.md) — no
# Bedrock generator, judge, or ApplyGuardrail call, no AWS credentials, no cost.
# The real evaluation scripts (scripts/run_dev_eval.py, run_holdout_eval.py, etc.)
# are intentionally never invoked here; they're run manually, on demand, exactly
# once for the holdout split (see the run_holdout_eval.py module docstring).

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-extras
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync --all-extras

      # Policy/config validation first: config/policy.yaml and config/guardrails.yaml
      # must parse and satisfy their invariants (real metric names, hard vs. soft
      # gate structure, absolute floors, etc.) before anything downstream is trusted.
      - name: Policy / config validation
        run: uv run pytest -q tests/unit/test_config.py tests/unit/test_policy_engine.py

      # Statistical engine: pairing, bootstrap CI, median/effect-size/Holm (Phase 2).
      - name: Statistical tests
        run: >
          uv run pytest -q
          tests/unit/test_regression_compare.py
          tests/unit/test_regression_statistics.py

      # Structured JSON reporting layer (Phase 3).
      - name: Reporting tests
        run: uv run pytest -q tests/unit/test_reporting.py

      # Everything else: models, DB store, guardrails, quality scoring, prompt
      # registry, holdout isolation, etc. Runs last so a narrower, faster-signal
      # failure above is reported first.
      - name: Full unit test suite
        run: uv run pytest -q
